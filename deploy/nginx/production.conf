# Production reverse proxy: sidham.in, www.sidham.in, api.sidham.in, nexus.sidham.in
# Certificates: /etc/letsencrypt/live/sidham.in/ (mounted read-only). Renewal uses the webroot method (see CUTOVER-PLAN.md),
# so nginx never has to be stopped for a renewal again.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # old Next.js product URLs (/product/<uuid>) -> new slug URLs
    include /etc/nginx/conf.d/old-product-redirects.conf;

    upstream api { server backend-uat:5000; }
    upstream web { server frontend-uat:80; }

    # ------------------------------------------------------------------ HTTP: ACME challenge + redirect to HTTPS
    server {
        listen 80 default_server;
        server_name sidham.in www.sidham.in api.sidham.in nexus.sidham.in;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # anything addressed to an unknown host is dropped
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;
        return 444;
    }

    # shared TLS + header settings are repeated per server (nginx has no include-by-reference for ssl_* inside http)

    # ------------------------------------------------------------------ www -> apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.sidham.in;
        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;
        return 301 https://sidham.in$request_uri;
    }

    # ------------------------------------------------------------------ nexus (old admin address) -> admin panel
    server {
        listen 443 ssl;
        http2 on;
        server_name nexus.sidham.in;
        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;
        return 301 https://sidham.in/admin/login;
    }

    # ------------------------------------------------------------------ storefront + admin (Angular)
    server {
        listen 443 ssl;
        http2 on;
        server_name sidham.in;

        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---- permanent redirects from the previous site's URLs (keeps search rankings and bookmarks)
        if ($old_product_target) { return 301 $old_product_target; }
        rewrite ^/all-products/?$                        /products                    permanent;
        rewrite ^/about-us/?$                            /about                       permanent;
        rewrite ^/contact-us/?$                          /contact                     permanent;
        rewrite ^/faq/?$                                 /faqs                        permanent;
        rewrite ^/category/([^/]+)/?$                    /products/category/$1        permanent;
        rewrite ^/search/?$                              /products                    permanent;
        rewrite ^/orders/?$                              /account/orders              permanent;
        rewrite ^/profile/?$                             /account/profile             permanent;
        rewrite ^/refund-request/?$                      /account/returns             permanent;
        rewrite ^/order-success/?$                       /                            permanent;
        rewrite ^/support/?$                             /contact                     permanent;
        rewrite ^/(privacy-and-cookies-policy|cookies-policy)/?$ /page/privacy-policy permanent;
        rewrite ^/terms-of-service/?$                    /page/terms-conditions       permanent;
        rewrite ^/refunds-returns-cancellation/?$        /page/refund-policy          permanent;
        rewrite ^/shipping-delivery-policy/?$            /page/shipping-policy        permanent;

        # uploaded media is served by the API (it owns the uploads volume, so new admin uploads appear immediately)
        location ^~ /uploads/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # the hashed Angular bundles can be cached for a year; index.html must not be
        location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
            proxy_pass http://web;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    # ------------------------------------------------------------------ API
    server {
        listen 443 ssl;
        http2 on;
        server_name api.sidham.in;

        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        location ^~ /uploads/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
