# Maintenance mode: every request gets a 503 page, so search engines keep the pages and browsers retry later.
# Swap in by pointing the proxy container at this file instead of production.conf (see CUTOVER-PLAN.md step 3).
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/sidham.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sidham.in/privkey.pem;

        error_page 503 @maintenance;
        location / { return 503; }
        location @maintenance {
            root /usr/share/nginx/maintenance;
            rewrite ^ /maintenance.html break;
            add_header Retry-After 1800 always;
            add_header Cache-Control "no-store" always;
        }
    }
}
